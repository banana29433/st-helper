            color: #ffffff;

            margin: 0;
        }

        }

        }

            padding: 12px 24px;

            color: white;

        button:hover {
            background-color: #106ebe;
        }

            background-color: #2f2f2f;
            padding: 20px;
            border-radius: 4px;
            white-space: pre-wrap;
            margin-top: 20px;
        }

            background-color: #333;
            padding: 15px;
            border-left: 4px solid #0078d4;
            margin-top: 20px;
            border-radius: 4px;
        }

        input {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #0078d4;
            border-radius: 4px;
            background-color: #333;
            color: #fff;
            width: 100px;
        }

        label {
            font-size: 1rem;
            color: #fff;
        }
    </style>
</head>

        function getRandomItem(array, requiredCohosts = 0) {
            const validItems = array.filter(item => {
                const itemCohosts = scenarioData[item]?.cohosts || 0;
                return getCohostCount() >= itemCohosts;
            });
            return validItems[Math.floor(Math.random() * validItems.length)];
        }

        function randomInt(min, max) {
            if (min === undefined || max === undefined) {
                return Math.floor(Math.random() * 4);
            }
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function getCohostCount() {
            return parseInt(document.getElementById('cohostCount').value) || 0;
        }

        function getRandomVariant(scenario) {
            const variants = scenarioData[scenario].variants;
            if (!variants) return null;

            const validVariants = variants.filter(v => getCohostCount() >= (v.cohosts || 0));
            if (validVariants.length === 0) return null;

            const totalWeight = validVariants.reduce((sum, variant) => sum + (variant.weight || 1), 0);
            let random = Math.random() * totalWeight;

            for (const variant of validVariants) {
                random -= (variant.weight || 1);
                if (random <= 0) return variant;
            }
            return validVariants[0];
        }

        function getRandomDrills(scenario) {
            const data = scenarioData[scenario];
            if (!data) return [];
            if (data.description) return [{ drill: "Description", response: data.description }];

            const variant = getRandomVariant(scenario);
            if (!variant) return [];

            const cohostCount = getCohostCount();

            return variant.positions.map(positionDrills => {
                const validDrills = positionDrills.filter(d => {
                    const minCohosts = d.cohosts || 0;
                    const maxCohosts = d.maxCohosts || Infinity;
                    return cohostCount >= minCohosts && cohostCount <= maxCohosts;
                });

                if (validDrills.length === 0) {
                    // Try to find a drill with the closest requirements
                    const fallbackDrills = positionDrills.sort((a, b) =>
                        Math.abs((a.cohosts || 0) - cohostCount) - Math.abs((b.cohosts || 0) - cohostCount)
                    );
                    if (fallbackDrills.length > 0) {
                        const selectedDrill = fallbackDrills[0];
                        return {
                            drill: selectedDrill.drill,
                            response: selectedDrill.response
                        };
                    }
                    return { drill: "No suitable drill available", response: "Skip this position" };
                }

                const selectedDrill = getRandomItem(validDrills);
                return {
                    drill: selectedDrill.drill,
                    response: selectedDrill.response
                };
            });
        }

        function generatePlan() {
            let plan = "";

            // Generate a scenario from each group
            const scenario1 = getRandomItem(scenarios.group1);
            const scenario2 = getRandomItem(scenarios.group2);
            const scenario3 = getRandomItem(scenarios.group3);


            plan += `[${scenario1}]\n`;
            getRandomDrills(scenario1).forEach((item, index) => {
                plan += `${index + 1}. ${item.drill}\n> ${item.response}\n`;
            });


            plan += `\n[${scenario2}]\n`;
            if (scenario2 !== "Intercom Sweep") {
                getRandomDrills(scenario2).forEach((item, index) => {
                    plan += `${index + 1}. ${item.drill}\n> ${item.response}\n`;
                });
            }


            plan += `\n[${scenario3}]\n`;
            if (scenario3 !== "Hostage Situation") {
                getRandomDrills(scenario3).forEach((item, index) => {
                    plan += `${index + 1}. ${item.drill}\n> ${item.response}\n`;
                });
            }

            document.getElementById("trainingPlan").textContent = plan;
        }
